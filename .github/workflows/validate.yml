name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装 workspace 依赖
        run: npm ci

      - name: 统一工程验证
        # 与本地提交前入口完全相同。--ci 额外断言所有生成器运行后工作树仍干净，
        # 同时覆盖漏提交 dist、registry、SDK 产物与不可复现构建。
        run: npm run verify -- --ci
